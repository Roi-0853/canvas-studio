<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>My Canvas Editor</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/konva@9/konva.min.js"></script>
</head>
<body> 

  <div id="toolbar">
    <button id="addRect">
      <img src="./assets/icons/square-rounded-plus-2.svg" class="btn-icon" alt="" onerror="this.style.display='none'" />
    </button>
    <button id="saveBtn">
      <img src="./assets/icons/file-download.svg" class="btn-icon" alt="" onerror="this.style.display='none'" />
    </button>
    <button id="loadBtn">
      <img src="./assets/icons/file-upload.svg" class="btn-icon" alt="" onerror="this.style.display='none'" />
    </button>
    <input type="file" id="fileInput" accept=".mycanvas" style="display: none;" />
  </div>

  <div id="container"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
