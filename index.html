<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>My Canvas Editor</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/konva@9/konva.min.js"></script>
</head>
<body>

  <div id="toolbar">
    <button id="addRect">Kutu Ekle</button>
    <button id="connectBtn" title="Bağlan: kaynak karta, sonra hedef karta tıkla">Bağlan</button>
    <button id="saveBtn">Kaydet (.mycanvas)</button>
    <button id="loadBtn">Dosya Aç (.mycanvas)</button>
    <input type="file" id="fileInput" accept=".mycanvas" style="display: none;" />
  </div>

  <div id="container"></div>

  <!-- Scripti ES Modülü olarak yüklüyoruz -->
  <script type="module" src="script.js"></script>
</body>
</html>
